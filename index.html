<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad Web dengan Timer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            color: #000000;
        }

        /* Top Menu Bar */
        .menu-bar {
            background-color: #f0f0f0;
            border-bottom: 1px solid #dcdcdc;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #333;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid #ababab;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 2px;
            font-weight: 600;
        }

        .btn:hover {
            background-color: #e5e5e5;
        }

        .btn-start {
            background-color: #008cba;
            color: white;
            border-color: #007399;
        }

        .btn-start:hover {
            background-color: #007399;
        }

        .btn-stop {
            background-color: #d9534f;
            color: white;
            border-color: #d43f3a;
        }

        .btn-stop:hover {
            background-color: #c9302c;
        }

        /* Input Controls */
        input[type="number"] {
            width: 50px;
            padding: 3px 5px;
            border: 1px solid #ababab;
            border-radius: 2px;
            outline: none;
            font-size: 0.85rem;
            font-family: monospace;
        }

        input[type="color"] {
            width: 28px;
            height: 26px;
            border: 1px solid #ababab;
            border-radius: 2px;
            cursor: pointer;
            background: none;
        }

        /* Timer Box Display */
        .timer-display {
            font-weight: bold;
            font-size: 1rem;
            font-family: monospace;
            background: #ffffff;
            padding: 2px 8px;
            border: 1px solid #ababab;
            border-radius: 2px;
            min-width: 60px;
            text-align: center;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.5;
            background-color: #ffffff;
            color: #000000;
            transition: background-color 0.2s;
        }

        /* Efek Latar Kedap-Kedip saat Waktu Habis */
        @keyframes flashing-bg {
            0% { background-color: #ff0000; color: #ffffff; }
            25% { background-color: #ffff00; color: #000000; }
            50% { background-color: #00ff00; color: #000000; }
            75% { background-color: #00ffff; color: #000000; }
            100% { background-color: #ff00ff; color: #ffffff; }
        }

        textarea.time-up {
            animation: flashing-bg 0.4s infinite alternate !important;
        }

        /* Status Bar Bottom */
        .status-bar {
            background-color: #f0f0f0;
            border-top: 1px solid #dcdcdc;
            padding: 4px 15px;
            font-size: 0.8rem;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="menu-bar">
        <div class="menu-group">
            <button class="btn" onclick="newFile()">File Baru</button>
            <button class="btn" onclick="document.getElementById('fileInput').click()">Buka File</button>
            <button class="btn" onclick="downloadFile()">Simpan (.txt)</button>
            <input type="file" id="fileInput" style="display: none;" accept=".txt" onchange="openFile(event)">
        </div>

        <div class="menu-group">
            <div class="control-item">
                <label for="fontSize">Ukuran:</label>
                <input type="number" id="fontSize" value="16" min="10" max="72">
            </div>

            <div class="control-item">
                <label for="textColor">Font:</label>
                <input type="color" id="textColor" value="#000000">
            </div>

            <div class="control-item">
                <label for="bgColor">Kertas:</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>

        <div class="menu-group">
            <div class="control-item">
                <label>Timer:</label>
                <input type="number" id="timerMins" value="1" min="0" max="180" placeholder="m">m
                <input type="number" id="timerSecs" value="0" min="0" max="59" placeholder="s">s
            </div>
            <div class="timer-display" id="timerDisplay">01:00</div>
            <button class="btn btn-start" id="timerBtn" onclick="toggleTimer()">Start</button>
        </div>
    </div>

    <div class="editor-container">
        <textarea id="notepad" placeholder="Mulai mengetik di sini..." oninput="updateStats()"></textarea>
    </div>

    <div class="status-bar">
        <span id="autoSaveStatus">Tersimpan otomatis</span>
        <span id="stats">Karakter: 0 | Kata: 0</span>
    </div>

    <script>
        const notepad = document.getElementById('notepad');
        const stats = document.getElementById('stats');
        const autoSaveStatus = document.getElementById('autoSaveStatus');
        
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const bgColorInput = document.getElementById('bgColor');

        const timerMinsInput = document.getElementById('timerMins');
        const timerSecsInput = document.getElementById('timerSecs');
        const timerDisplay = document.getElementById('timerDisplay');
        const timerBtn = document.getElementById('timerBtn');

        let timerInterval = null;
        let totalSeconds = 0;
        let isTimerRunning = false;

        // Memuat teks & pengaturan dari LocalStorage saat web dibuka
        window.onload = function() {
            const savedText = localStorage.getItem('webNotepadText');
            if (savedText !== null) notepad.value = savedText;

            const savedFontSize = localStorage.getItem('webNotepadFontSize');
            if (savedFontSize) fontSizeInput.value = savedFontSize;

            const savedTextColor = localStorage.getItem('webNotepadTextColor');
            if (savedTextColor) textColorInput.value = savedTextColor;

            const savedBgColor = localStorage.getItem('webNotepadBgColor');
            if (savedBgColor) bgColorInput.value = savedBgColor;

            applyStyles();
            updateStats();
            initTimerDisplay();
        };

        // Mengubah gaya tampilan textarea
        function applyStyles() {
            notepad.style.fontSize = fontSizeInput.value + 'px';
            notepad.style.color = textColorInput.value;
            notepad.style.backgroundColor = bgColorInput.value;

            localStorage.setItem('webNotepadFontSize', fontSizeInput.value);
            localStorage.setItem('webNotepadTextColor', textColorInput.value);
            localStorage.setItem('webNotepadBgColor', bgColorInput.value);
        }

        fontSizeInput.addEventListener('input', applyStyles);
        textColorInput.addEventListener('input', applyStyles);
        bgColorInput.addEventListener('input', applyStyles);

        // Update jumlah kata & karakter
        function updateStats() {
            const text = notepad.value;
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            stats.textContent = `Karakter: ${charCount} | Kata: ${wordCount}`;
            localStorage.setItem('webNotepadText', text);
            autoSaveStatus.textContent = "Tersimpan otomatis";

            // Hentikan efek kedap-kedip jika pengguna mulai mengetik/mengeklik lembar kerja
            if (notepad.classList.contains('time-up')) {
                resetFlashing();
            }
        }

        // Setup Tampilan Awal Timer
        function initTimerDisplay() {
            if (!isTimerRunning) {
                const m = parseInt(timerMinsInput.value) || 0;
                const s = parseInt(timerSecsInput.value) || 0;
                totalSeconds = (m * 60) + s;
                formatTimerDisplay(totalSeconds);
            }
        }

        function formatTimerDisplay(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        timerMinsInput.addEventListener('change', initTimerDisplay);
        timerSecsInput.addEventListener('change', initTimerDisplay);

        // Toggle Start/Stop Timer
        function toggleTimer() {
            if (isTimerRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            resetFlashing();
            
            if (totalSeconds <= 0) {
                initTimerDisplay();
            }

            if (totalSeconds <= 0) return;

            isTimerRunning = true;
            timerBtn.textContent = 'Stop';
            timerBtn.classList.remove('btn-start');
            timerBtn.classList.add('btn-stop');

            timerInterval = setInterval(() => {
                totalSeconds--;
                formatTimerDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerBtn.textContent = 'Start';
                    timerBtn.classList.remove('btn-stop');
                    timerBtn.classList.add('btn-start');

                    // Memicu efek kedap-kedip warna latar
                    notepad.classList.add('time-up');
                    playBeepSound();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerBtn.textContent = 'Start';
            timerBtn.classList.remove('btn-stop');
            timerBtn.classList.add('btn-start');
            resetFlashing();
            initTimerDisplay();
        }

        function resetFlashing() {
            notepad.classList.remove('time-up');
            applyStyles(); // Kembalikan ke warna asli
        }

        // Bunyi Alarm Sederhana dari Web Audio API
        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz (A5)
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5); // Berbunyi 1.5 detik
            } catch (e) {
                console.log("Audio not allowed without user interaction.");
            }
        }

        // Buat Dokumen Baru
        function newFile() {
            if (notepad.value.trim() !== "") {
                if (confirm("Apakah Anda yakin ingin membuat catatan baru?")) {
                    notepad.value = "";
                    updateStats();
                }
            }
        }

        // Unduh Teks sebagai file .txt
        function downloadFile() {
            const text = notepad.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = 'Catatan.txt';
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
            window.URL.revokeObjectURL(anchor.href);
        }

        // Buka File .txt dari Komputer
        function openFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                notepad.value = e.target.result;
                updateStats();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
