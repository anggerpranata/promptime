<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad & Timer Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            color: #000000;
        }

        /* Top Navigation Tabs */
        .tab-bar {
            background-color: #e1dfdd;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            padding-left: 10px;
            gap: 4px;
        }

        .tab-btn {
            background-color: #d1d1d1;
            border: 1px solid #ababab;
            border-bottom: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-weight: 600;
            color: #444;
        }

        .tab-btn.active {
            background-color: #ffffff;
            border-top: 2px solid #008cba;
            color: #000;
        }

        /* Top Control Bar */
        .control-bar {
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #333;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid #ababab;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 2px;
            font-weight: 600;
        }

        .btn:hover { background-color: #e5e5e5; }
        .btn-start { background-color: #008cba; color: white; border-color: #007399; }
        .btn-start:hover { background-color: #007399; }
        .btn-stop { background-color: #d9534f; color: white; border-color: #d43f3a; }
        .btn-stop:hover { background-color: #c9302c; }

        input[type="number"] {
            width: 50px;
            padding: 3px 5px;
            border: 1px solid #ababab;
            border-radius: 2px;
            outline: none;
            font-size: 0.85rem;
            font-family: monospace;
        }

        input[type="color"] {
            width: 28px;
            height: 26px;
            border: 1px solid #ababab;
            border-radius: 2px;
            cursor: pointer;
            background: none;
        }

        /* Tab Content Area */
        .tab-content {
            flex: 1;
            display: none;
            overflow: hidden;
            position: relative;
        }

        .tab-content.active {
            display: flex;
        }

        /* Tab 1: Editor Window */
        textarea {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: none;
            outline: none;
            resize: none;
            font-size: 16px;
            line-height: 1.5;
            background-color: #ffffff;
            color: #000000;
            transition: background-color 0.2s;
        }

        /* Flashing animation on time's up */
        @keyframes flashing-bg {
            0% { background-color: #ff0000; color: #ffffff; }
            25% { background-color: #ffff00; color: #000000; }
            50% { background-color: #00ff00; color: #000000; }
            75% { background-color: #00ffff; color: #000000; }
            100% { background-color: #ff00ff; color: #ffffff; }
        }

        textarea.time-up {
            animation: flashing-bg 0.4s infinite alternate !important;
        }

        /* Tab 2: Timer Window */
        .timer-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            gap: 20px;
        }

        .large-timer-display {
            font-size: 5rem;
            font-family: monospace;
            font-weight: bold;
            background: #ffffff;
            padding: 10px 30px;
            border: 2px solid #ababab;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .timer-controls-large {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.1rem;
        }

        .timer-controls-large input {
            width: 70px;
            font-size: 1.2rem;
            padding: 5px;
            text-align: center;
        }

        /* Status Bar Bottom */
        .status-bar {
            background-color: #f0f0f0;
            border-top: 1px solid #dcdcdc;
            padding: 4px 15px;
            font-size: 0.8rem;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('editorTab', this)">📝 Jendela Ketik</button>
        <button class="tab-btn" onclick="switchTab('timerTab', this)">⏱️ Jendela Timer</button>
    </div>

    <div class="control-bar" id="editorControls">
        <div class="menu-group">
            <button class="btn" onclick="newFile()">File Baru</button>
            <button class="btn" onclick="document.getElementById('fileInput').click()">Buka File</button>
            <button class="btn" onclick="downloadFile()">Simpan (.txt)</button>
            <input type="file" id="fileInput" style="display: none;" accept=".txt" onchange="openFile(event)">
        </div>

        <div class="menu-group">
            <div class="control-item">
                <label for="fontSize">Ukuran:</label>
                <input type="number" id="fontSize" value="16" min="10" max="72">
            </div>

            <div class="control-item">
                <label for="textColor">Font:</label>
                <input type="color" id="textColor" value="#000000">
            </div>

            <div class="control-item">
                <label for="bgColor">Kertas:</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>
    </div>

    <div id="editorTab" class="tab-content active">
        <textarea id="notepad" placeholder="Mulai mengetik di sini..." oninput="updateStats()"></textarea>
    </div>

    <div id="timerTab" class="tab-content">
        <div class="timer-window">
            <div class="large-timer-display" id="largeTimerDisplay">01:00</div>
            
            <div class="timer-controls-large">
                <label>Set Timer:</label>
                <input type="number" id="timerMins" value="1" min="0" max="180"> Menit
                <input type="number" id="timerSecs" value="0" min="0" max="59"> Detik
            </div>

            <div>
                <button class="btn btn-start" id="timerBtn" style="font-size: 1.2rem; padding: 8px 24px;" onclick="toggleTimer()">Start Countdown</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="autoSaveStatus">Tersimpan otomatis</span>
        <span id="stats">Karakter: 0 | Kata: 0</span>
    </div>

    <script>
        const notepad = document.getElementById('notepad');
        const stats = document.getElementById('stats');
        const autoSaveStatus = document.getElementById('autoSaveStatus');
        
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const bgColorInput = document.getElementById('bgColor');

        const timerMinsInput = document.getElementById('timerMins');
        const timerSecsInput = document.getElementById('timerSecs');
        const largeTimerDisplay = document.getElementById('largeTimerDisplay');
        const timerBtn = document.getElementById('timerBtn');

        let timerInterval = null;
        let totalSeconds = 0;
        let isTimerRunning = false;

        // Switch Tabs
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            // Hide/Show Top Editor Controls
            if (tabId === 'editorTab') {
                document.getElementById('editorControls').style.display = 'flex';
            } else {
                document.getElementById('editorControls').style.display = 'none';
            }
        }

        // Init App
        window.onload = function() {
            const savedText = localStorage.getItem('webNotepadText');
            if (savedText !== null) notepad.value = savedText;

            const savedFontSize = localStorage.getItem('webNotepadFontSize');
            if (savedFontSize) fontSizeInput.value = savedFontSize;

            const savedTextColor = localStorage.getItem('webNotepadTextColor');
            if (savedTextColor) textColorInput.value = savedTextColor;

            const savedBgColor = localStorage.getItem('webNotepadBgColor');
            if (savedBgColor) bgColorInput.value = savedBgColor;

            applyStyles();
            updateStats();
            initTimerDisplay();
        };

        // Style Applicator
        function applyStyles() {
            notepad.style.fontSize = fontSizeInput.value + 'px';
            notepad.style.color = textColorInput.value;
            notepad.style.backgroundColor = bgColorInput.value;

            localStorage.setItem('webNotepadFontSize', fontSizeInput.value);
            localStorage.setItem('webNotepadTextColor', textColorInput.value);
            localStorage.setItem('webNotepadBgColor', bgColorInput.value);
        }

        fontSizeInput.addEventListener('input', applyStyles);
        textColorInput.addEventListener('input', applyStyles);
        bgColorInput.addEventListener('input', applyStyles);

        function updateStats() {
            const text = notepad.value;
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            stats.textContent = `Karakter: ${charCount} | Kata: ${wordCount}`;
            localStorage.setItem('webNotepadText', text);
            autoSaveStatus.textContent = "Tersimpan otomatis";

            if (notepad.classList.contains('time-up')) {
                resetFlashing();
            }
        }

        // Timer Logic
        function initTimerDisplay() {
            if (!isTimerRunning) {
                const m = parseInt(timerMinsInput.value) || 0;
                const s = parseInt(timerSecsInput.value) || 0;
                totalSeconds = (m * 60) + s;
                formatTimerDisplay(totalSeconds);
            }
        }

        function formatTimerDisplay(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            largeTimerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        timerMinsInput.addEventListener('change', initTimerDisplay);
        timerSecsInput.addEventListener('change', initTimerDisplay);

        function toggleTimer() {
            if (isTimerRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            resetFlashing();
            if (totalSeconds <= 0) initTimerDisplay();
            if (totalSeconds <= 0) return;

            isTimerRunning = true;
            timerBtn.textContent = 'Stop Countdown';
            timerBtn.classList.remove('btn-start');
            timerBtn.classList.add('btn-stop');

            timerInterval = setInterval(() => {
                totalSeconds--;
                formatTimerDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerBtn.textContent = 'Start Countdown';
                    timerBtn.classList.remove('btn-stop');
                    timerBtn.classList.add('btn-start');

                    // Switch back to editor tab and start flashing
                    switchTab('editorTab', document.querySelectorAll('.tab-btn')[0]);
                    notepad.classList.add('time-up');
                    playBeepSound();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerBtn.textContent = 'Start Countdown';
            timerBtn.classList.remove('btn-stop');
            timerBtn.classList.add('btn-start');
            resetFlashing();
            initTimerDisplay();
        }

        function resetFlashing() {
            notepad.classList.remove('time-up');
            applyStyles();
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.log("Audio alert blocked.");
            }
        }

        // File Management
        function newFile() {
            if (notepad.value.trim() !== "") {
                if (confirm("Apakah Anda yakin ingin membuat catatan baru?")) {
                    notepad.value = "";
                    updateStats();
                }
            }
        }

        function downloadFile() {
            const text = notepad.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = 'Catatan.txt';
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
            window.URL.revokeObjectURL(anchor.href);
        }

        function openFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                notepad.value = e.target.result;
                updateStats();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
