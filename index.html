<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad & Timer Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f0f0;
            color: #000000;
            overflow: hidden;
        }

        /* Top Navigation Bar */
        .tab-bar {
            background-color: #e1dfdd;
            border-bottom: 1px solid #dcdcdc;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px 0 10px;
        }

        .tab-group {
            display: flex;
            gap: 4px;
        }

        .tab-btn {
            background-color: #d1d1d1;
            border: 1px solid #ababab;
            border-bottom: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-weight: 600;
            color: #444;
        }

        .tab-btn.active {
            background-color: #ffffff;
            border-top: 2px solid #008cba;
            color: #000;
        }

        /* Layout Switcher Control */
        .layout-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .btn-layout {
            background-color: #ffffff;
            border: 1px solid #ababab;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
            font-weight: 600;
        }

        .btn-layout.active {
            background-color: #008cba;
            color: #ffffff;
            border-color: #007399;
        }

        /* Main Workspace & Split Screen Manager */
        .workspace {
            flex: 1;
            display: flex;
            width: 100%;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* Split Screen Modes */
        .workspace.mode-editor #editorTab { display: flex; flex: 1; width: 100%; }
        .workspace.mode-editor #timerTab { display: none; }

        .workspace.mode-timer #editorTab { display: none; }
        .workspace.mode-timer #timerTab { display: flex; flex: 1; width: 100%; }

        .workspace.mode-split #editorTab { display: flex; flex: 1; width: 50%; border-right: 2px solid #dcdcdc; }
        .workspace.mode-split #timerTab { display: flex; flex: 1; width: 50%; }

        /* Shared Control Bar Style */
        .control-bar {
            background-color: #ffffff;
            border-bottom: 1px solid #dcdcdc;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .menu-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #333;
        }

        .btn {
            background-color: #ffffff;
            border: 1px solid #ababab;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 2px;
            font-weight: 600;
            user-select: none;
        }

        .btn:hover { background-color: #e5e5e5; }

        .btn-align { padding: 3px 6px; font-weight: bold; }
        .btn-align.active { background-color: #008cba; color: #ffffff; border-color: #007399; }

        .btn-alert { background-color: #ff8c00; color: #ffffff; border-color: #e07b00; }
        .btn-alert:hover { background-color: #e07b00; }
        .btn-alert.active { background-color: #d9534f; border-color: #d43f3a; }

        .btn-start { background-color: #008cba; color: white; border-color: #007399; }
        .btn-start:hover { background-color: #007399; }
        .btn-stop { background-color: #d9534f; color: white; border-color: #d43f3a; }
        .btn-stop:hover { background-color: #c9302c; }

        input[type="number"], input[type="text"] {
            padding: 3px 5px;
            border: 1px solid #ababab;
            border-radius: 2px;
            outline: none;
            font-size: 0.8rem;
            font-family: monospace;
        }

        input[type="number"] { width: 50px; }

        input[type="color"] {
            width: 26px;
            height: 24px;
            border: 1px solid #ababab;
            border-radius: 2px;
            cursor: pointer;
            background: none;
        }

        /* Tab Content Panel */
        .tab-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        /* Editor Section */
        .editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }

        .editor-wrapper.v-top { justify-content: flex-start; }
        .editor-wrapper.v-middle { justify-content: center; }
        .editor-wrapper.v-bottom { justify-content: flex-end; }

        textarea {
            width: 100%;
            height: 100%;
            padding: 15px;
            border: none;
            outline: none;
            resize: none;
            font-size: 200px;
            line-height: 1.5;
            letter-spacing: 0px;
            background-color: transparent;
            color: #000000;
            text-align: left;
        }

        .editor-wrapper.v-middle textarea,
        .editor-wrapper.v-bottom textarea {
            height: auto;
            max-height: 100%;
        }

        /* Custom Flashing Animation */
        @keyframes custom-flashing {
            0% { background-color: var(--flash-color-1); }
            100% { background-color: var(--flash-color-2); }
        }

        .editor-wrapper.flashing-active,
        .timer-window.time-up {
            animation: custom-flashing 0.4s infinite alternate !important;
        }

        /* Timer Section */
        .timer-window {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
        }

        .timer-display-box {
            text-align: center;
            word-break: break-word;
            max-width: 90%;
        }

        .large-timer-display {
            font-size: 400px;
            font-family: monospace;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Status Bar Bottom */
        .status-bar {
            background-color: #f0f0f0;
            border-top: 1px solid #dcdcdc;
            padding: 4px 15px;
            font-size: 0.8rem;
            color: #555555;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Tab Header Navigation -->
    <div class="tab-bar">
        <div class="tab-group">
            <button class="tab-btn active" id="tabEditorBtn" onclick="setLayoutMode('editor')">📝 Jendela Ketik</button>
            <button class="tab-btn" id="tabTimerBtn" onclick="setLayoutMode('timer')">⏱️ Jendela Timer</button>
        </div>

        <!-- Mode Tampilan Switcher -->
        <div class="layout-switcher">
            <label>Mode Tampilan:</label>
            <button class="btn-layout active" id="modeEditorBtn" onclick="setLayoutMode('editor')">📄 Full Ketik</button>
            <button class="btn-layout" id="modeTimerBtn" onclick="setLayoutMode('timer')">⏱️ Full Timer</button>
            <button class="btn-layout" id="modeSplitBtn" onclick="setLayoutMode('split')">📑 Split (2 Tab)</button>
        </div>
    </div>

    <!-- Main Workspace Container -->
    <div class="workspace mode-editor" id="workspace">

        <!-- TAB 1: Editor Window -->
        <div id="editorTab" class="tab-panel">
            <div class="control-bar">
                <div class="menu-group">
                    <button class="btn" onclick="newFile()">Baru</button>
                    <button class="btn" onclick="document.getElementById('fileInput').click()">Buka</button>
                    <button class="btn" onclick="downloadFile()">Simpan</button>
                    <input type="file" id="fileInput" style="display: none;" accept=".txt" onchange="openFile(event)">
                    
                    <button class="btn btn-alert" id="lightAlertBtn" onclick="toggleFlashLight()">💡 Lampu: OFF</button>
                </div>

                <div class="menu-group">
                    <div class="control-item">
                        <label>Rata H:</label>
                        <button class="btn btn-align active" id="alignLeft" onclick="setTextAlign('left')">⬅</button>
                        <button class="btn btn-align" id="alignCenter" onclick="setTextAlign('center')">↔</button>
                        <button class="btn btn-align" id="alignRight" onclick="setTextAlign('right')">➡</button>
                    </div>

                    <div class="control-item">
                        <label>Rata V:</label>
                        <button class="btn btn-align active" id="vAlignTop" onclick="setVerticalAlign('top')">⬆</button>
                        <button class="btn btn-align" id="vAlignCenter" onclick="setVerticalAlign('middle')">↕</button>
                        <button class="btn btn-align" id="vAlignBottom" onclick="setVerticalAlign('bottom')">⬇</button>
                    </div>

                    <div class="control-item">
                        <label for="letterSpacing">Spasi:</label>
                        <input type="number" id="letterSpacing" value="0" min="-2" max="50">
                    </div>

                    <div class="control-item">
                        <label for="lineHeight">Baris:</label>
                        <input type="number" id="lineHeight" value="1.5" min="0.8" max="4" step="0.1">
                    </div>

                    <div class="control-item">
                        <label for="fontSize">Ukuran:</label>
                        <input type="number" id="fontSize" value="200" min="10" max="500">
                    </div>

                    <div class="control-item">
                        <label for="textColor">Font:</label>
                        <input type="color" id="textColor" value="#000000">
                    </div>

                    <div class="control-item">
                        <label for="bgColor">Kertas:</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                </div>
            </div>

            <div class="editor-wrapper v-top" id="editorWrapper">
                <textarea id="notepad" placeholder="Mulai mengetik di sini..." oninput="updateStats()"></textarea>
            </div>
        </div>

        <!-- TAB 2: Timer Window -->
        <div id="timerTab" class="tab-panel">
            <div class="control-bar">
                <div class="menu-group">
                    <div class="control-item">
                        <label>Durasi:</label>
                        <input type="number" id="timerMins" value="1" min="0" max="180"> m
                        <input type="number" id="timerSecs" value="0" min="0" max="59"> s
                    </div>

                    <div class="control-item">
                        <label for="timerFontSize">Ukuran:</label>
                        <input type="number" id="timerFontSize" value="400" min="20" max="800">
                    </div>

                    <div class="control-item">
                        <label for="timerTextColor">Font:</label>
                        <input type="color" id="timerTextColor" value="#000000">
                    </div>

                    <div class="control-item">
                        <label for="timerBgColor">Latar:</label>
                        <input type="color" id="timerBgColor" value="#ffffff">
                    </div>

                    <div class="control-item">
                        <label for="flashColor1">Kedip 1:</label>
                        <input type="color" id="flashColor1" value="#ff0000">
                        <label for="flashColor2">Kedip 2:</label>
                        <input type="color" id="flashColor2" value="#ffff00">
                    </div>
                </div>

                <div class="menu-group">
                    <div class="control-item">
                        <label for="alertMessage">Pesan:</label>
                        <input type="text" id="alertMessage" value="WAKTU HABIS!" style="width: 120px;">
                    </div>

                    <button class="btn btn-start" id="timerBtn" onclick="toggleTimer()">Start Countdown</button>
                </div>
            </div>

            <div class="timer-window" id="timerWindow" onclick="resetTimerFlashing()">
                <div class="timer-display-box">
                    <div class="large-timer-display" id="largeTimerDisplay">01:00</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="autoSaveStatus">Tersimpan otomatis</span>
        <span id="stats">Karakter: 0 | Kata: 0</span>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        const notepad = document.getElementById('notepad');
        const editorWrapper = document.getElementById('editorWrapper');
        const stats = document.getElementById('stats');
        const autoSaveStatus = document.getElementById('autoSaveStatus');
        
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const bgColorInput = document.getElementById('bgColor');
        const letterSpacingInput = document.getElementById('letterSpacing');
        const lineHeightInput = document.getElementById('lineHeight');

        const timerWindow = document.getElementById('timerWindow');
        const timerMinsInput = document.getElementById('timerMins');
        const timerSecsInput = document.getElementById('timerSecs');
        const timerFontSizeInput = document.getElementById('timerFontSize');
        const timerTextColorInput = document.getElementById('timerTextColor');
        const timerBgColorInput = document.getElementById('timerBgColor');
        const flashColor1Input = document.getElementById('flashColor1');
        const flashColor2Input = document.getElementById('flashColor2');
        const alertMessageInput = document.getElementById('alertMessage');
        const largeTimerDisplay = document.getElementById('largeTimerDisplay');
        const timerBtn = document.getElementById('timerBtn');
        const lightAlertBtn = document.getElementById('lightAlertBtn');

        let timerInterval = null;
        let totalSeconds = 0;
        let isTimerRunning = false;
        let isFlashingActive = false;
        let currentAlign = 'left';
        let currentVAlign = 'top';

        // Switch Layout Mode (Full Editor, Full Timer, atau Split Screen)
        function setLayoutMode(mode) {
            workspace.classList.remove('mode-editor', 'mode-timer', 'mode-split');
            workspace.classList.add('mode-' + mode);

            document.getElementById('tabEditorBtn').classList.remove('active');
            document.getElementById('tabTimerBtn').classList.remove('active');
            document.getElementById('modeEditorBtn').classList.remove('active');
            document.getElementById('modeTimerBtn').classList.remove('active');
            document.getElementById('modeSplitBtn').classList.remove('active');

            if (mode === 'editor') {
                document.getElementById('tabEditorBtn').classList.add('active');
                document.getElementById('modeEditorBtn').classList.add('active');
            } else if (mode === 'timer') {
                document.getElementById('tabTimerBtn').classList.add('active');
                document.getElementById('modeTimerBtn').classList.add('active');
            } else if (mode === 'split') {
                document.getElementById('tabEditorBtn').classList.add('active');
                document.getElementById('tabTimerBtn').classList.add('active');
                document.getElementById('modeSplitBtn').classList.add('active');
            }

            localStorage.setItem('webLayoutMode', mode);
            autoResizeTextarea();
        }

        // Init App
        window.onload = function() {
            const savedText = localStorage.getItem('webNotepadText');
            if (savedText !== null) notepad.value = savedText;

            const savedFontSize = localStorage.getItem('webNotepadFontSize');
            fontSizeInput.value = savedFontSize ? savedFontSize : "200";

            const savedTimerFontSize = localStorage.getItem('webTimerFontSize');
            timerFontSizeInput.value = savedTimerFontSize ? savedTimerFontSize : "400";

            const savedTextColor = localStorage.getItem('webNotepadTextColor');
            if (savedTextColor) textColorInput.value = savedTextColor;

            const savedBgColor = localStorage.getItem('webNotepadBgColor');
            if (savedBgColor) bgColorInput.value = savedBgColor;

            const savedSpacing = localStorage.getItem('webNotepadLetterSpacing');
            if (savedSpacing !== null) letterSpacingInput.value = savedSpacing;

            const savedLineHeight = localStorage.getItem('webNotepadLineHeight');
            if (savedLineHeight !== null) lineHeightInput.value = savedLineHeight;

            const savedAlign = localStorage.getItem('webNotepadAlign');
            if (savedAlign) setTextAlign(savedAlign);

            const savedVAlign = localStorage.getItem('webNotepadVAlign');
            if (savedVAlign) setVerticalAlign(savedVAlign);

            const savedLayoutMode = localStorage.getItem('webLayoutMode');
            if (savedLayoutMode) {
                setLayoutMode(savedLayoutMode);
            } else {
                setLayoutMode('editor');
            }

            applyStyles();
            applyTimerStyles();
            updateStats();
            initTimerDisplay();
        };

        // Rataan Teks Horizontal
        function setTextAlign(align) {
            currentAlign = align;
            notepad.style.textAlign = align;

            document.getElementById('alignLeft').classList.remove('active');
            document.getElementById('alignCenter').classList.remove('active');
            document.getElementById('alignRight').classList.remove('active');

            if (align === 'left') document.getElementById('alignLeft').classList.add('active');
            if (align === 'center') document.getElementById('alignCenter').classList.add('active');
            if (align === 'right') document.getElementById('alignRight').classList.add('active');

            localStorage.setItem('webNotepadAlign', align);
        }

        // Rataan Teks Vertikal
        function setVerticalAlign(vAlign) {
            currentVAlign = vAlign;
            editorWrapper.classList.remove('v-top', 'v-middle', 'v-bottom');
            editorWrapper.classList.add('v-' + vAlign);

            document.getElementById('vAlignTop').classList.remove('active');
            document.getElementById('vAlignCenter').classList.remove('active');
            document.getElementById('vAlignBottom').classList.remove('active');

            if (vAlign === 'top') document.getElementById('vAlignTop').classList.add('active');
            if (vAlign === 'middle') document.getElementById('vAlignCenter').classList.add('active');
            if (vAlign === 'bottom') document.getElementById('vAlignBottom').classList.add('active');

            localStorage.setItem('webNotepadVAlign', vAlign);
            autoResizeTextarea();
        }

        function autoResizeTextarea() {
            if (currentVAlign === 'middle' || currentVAlign === 'bottom') {
                notepad.style.height = 'auto';
                notepad.style.height = notepad.scrollHeight + 'px';
            } else {
                notepad.style.height = '100%';
            }
        }

        // Editor Styles
        function applyStyles() {
            notepad.style.fontSize = fontSizeInput.value + 'px';
            notepad.style.color = textColorInput.value;
            editorWrapper.style.backgroundColor = bgColorInput.value;
            notepad.style.letterSpacing = letterSpacingInput.value + 'px';
            notepad.style.lineHeight = lineHeightInput.value;

            localStorage.setItem('webNotepadFontSize', fontSizeInput.value);
            localStorage.setItem('webNotepadTextColor', textColorInput.value);
            localStorage.setItem('webNotepadBgColor', bgColorInput.value);
            localStorage.setItem('webNotepadLetterSpacing', letterSpacingInput.value);
            localStorage.setItem('webNotepadLineHeight', lineHeightInput.value);
            
            autoResizeTextarea();
        }

        fontSizeInput.addEventListener('input', applyStyles);
        textColorInput.addEventListener('input', applyStyles);
        bgColorInput.addEventListener('input', applyStyles);
        letterSpacingInput.addEventListener('input', applyStyles);
        lineHeightInput.addEventListener('input', applyStyles);

        function updateStats() {
            const text = notepad.value;
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;

            stats.textContent = `Karakter: ${charCount} | Kata: ${wordCount}`;
            localStorage.setItem('webNotepadText', text);
            autoSaveStatus.textContent = "Tersimpan otomatis";

            autoResizeTextarea();
        }

        // Lampu Peringatan (Toggle On/Off)
        function toggleFlashLight() {
            isFlashingActive = !isFlashingActive;

            if (isFlashingActive) {
                editorWrapper.style.setProperty('--flash-color-1', flashColor1Input.value);
                editorWrapper.style.setProperty('--flash-color-2', flashColor2Input.value);
                editorWrapper.classList.add('flashing-active');
                
                lightAlertBtn.textContent = '💡 Lampu: ON';
                lightAlertBtn.classList.add('active');
            } else {
                editorWrapper.classList.remove('flashing-active');
                applyStyles();

                lightAlertBtn.textContent = '💡 Lampu: OFF';
                lightAlertBtn.classList.remove('active');
            }
        }

        // Timer Styles & Custom Flash Colors
        function applyTimerStyles() {
            largeTimerDisplay.style.fontSize = timerFontSizeInput.value + 'px';
            timerWindow.style.color = timerTextColorInput.value;
            timerWindow.style.backgroundColor = timerBgColorInput.value;

            timerWindow.style.setProperty('--flash-color-1', flashColor1Input.value);
            timerWindow.style.setProperty('--flash-color-2', flashColor2Input.value);

            localStorage.setItem('webTimerFontSize', timerFontSizeInput.value);
        }

        timerFontSizeInput.addEventListener('input', applyTimerStyles);
        timerTextColorInput.addEventListener('input', applyTimerStyles);
        timerBgColorInput.addEventListener('input', applyTimerStyles);
        flashColor1Input.addEventListener('input', applyTimerStyles);
        flashColor2Input.addEventListener('input', applyTimerStyles);

        // Timer Logic
        function initTimerDisplay() {
            if (!isTimerRunning) {
                const m = parseInt(timerMinsInput.value) || 0;
                const s = parseInt(timerSecsInput.value) || 0;
                totalSeconds = (m * 60) + s;
                formatTimerDisplay(totalSeconds);
            }
        }

        function formatTimerDisplay(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            largeTimerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        timerMinsInput.addEventListener('change', initTimerDisplay);
        timerSecsInput.addEventListener('change', initTimerDisplay);

        function toggleTimer() {
            if (isTimerRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            resetTimerFlashing();
            if (totalSeconds <= 0) initTimerDisplay();
            if (totalSeconds <= 0) return;

            isTimerRunning = true;
            timerBtn.textContent = 'Stop Countdown';
            timerBtn.classList.remove('btn-start');
            timerBtn.classList.add('btn-stop');

            timerInterval = setInterval(() => {
                totalSeconds--;
                formatTimerDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isTimerRunning = false;
                    timerBtn.textContent = 'Start Countdown';
                    timerBtn.classList.remove('btn-stop');
                    timerBtn.classList.add('btn-start');

                    const customMsg = alertMessageInput.value.trim() || 'WAKTU HABIS!';
                    largeTimerDisplay.textContent = customMsg;
                    applyTimerStyles();
                    timerWindow.classList.add('time-up');
                    playBeepSound();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerBtn.textContent = 'Start Countdown';
            timerBtn.classList.remove('btn-stop');
            timerBtn.classList.add('btn-start');
            resetTimerFlashing();
            initTimerDisplay();
        }

        function resetTimerFlashing() {
            if (timerWindow.classList.contains('time-up')) {
                timerWindow.classList.remove('time-up');
                applyTimerStyles();
                initTimerDisplay();
            }
        }

        function playBeepSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.log("Audio alert blocked.");
            }
        }

        // File Management
        function newFile() {
            if (notepad.value.trim() !== "") {
                if (confirm("Apakah Anda yakin ingin membuat catatan baru?")) {
                    notepad.value = "";
                    updateStats();
                }
            }
        }

        function downloadFile() {
            const text = notepad.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const anchor = document.createElement('a');
            anchor.download = 'Catatan.txt';
            anchor.href = window.URL.createObjectURL(blob);
            anchor.click();
            window.URL.revokeObjectURL(anchor.href);
        }

        function openFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                notepad.value = e.target.result;
                updateStats();
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
