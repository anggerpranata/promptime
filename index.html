<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter & Timer Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #121212; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Control Panel Sidebar */
        .sidebar { width: 320px; background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #333; z-index: 10; }
        .sidebar h2 { font-size: 1.2rem; color: #00ff88; margin-bottom: 5px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #ccc; }
        input[type="range"], input[type="number"], textarea { background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; }
        textarea { height: 120px; resize: vertical; }
        
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #00ff88; color: #000; }
        .btn-secondary { background: #444; color: #fff; }
        button:hover { opacity: 0.9; }

        /* Display Area */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; }
        
        /* Timer Bar Top */
        .timer-display { background: #181818; text-align: center; padding: 10px; font-size: 2rem; font-weight: bold; font-family: monospace; color: #00ff88; border-bottom: 1px solid #333; }
        
        /* Prompter Area */
        .prompter-container { flex: 1; overflow-y: scroll; padding: 40vh 10% 50vh 10%; scroll-behavior: auto; }
        .prompter-container::-webkit-scrollbar { display: none; }
        .prompter-text { line-height: 1.6; text-align: center; font-weight: 600; white-space: pre-wrap; transition: transform 0.3s; }
        .flipped { transform: scaleX(-1); }

        /* Reading Focus Indicator */
        .focus-line { position: absolute; top: 55%; left: 0; right: 0; height: 2px; background: rgba(0, 255, 136, 0.4); pointer-events: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Control Panel</h2>
        
        <div class="control-group">
            <label for="script">Naskah / Teks Prompt:</label>
            <textarea id="script" placeholder="Ketik atau tempel naskah di sini..."></textarea>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn-primary">Start / Pause</button>
            <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>

        <div class="control-group">
            <label for="speed">Kecepatan (Speed): <span id="speedVal">3</span></label>
            <input type="range" id="speed" min="1" max="10" value="3">
        </div>

        <div class="control-group">
            <label for="fontSize">Ukuran Teks (PX): <span id="fontVal">48</span></label>
            <input type="range" id="fontSize" min="20" max="100" value="48">
        </div>

        <div class="control-group">
            <label>
                <input type="checkbox" id="flipToggle"> Flip Horizon (Mirror Mode)
            </label>
        </div>
    </div>

    <div class="main-content">
        <div class="timer-display" id="timer">00:00:00</div>
        <div class="focus-line"></div>
        <div class="prompter-container" id="prompterContainer">
            <div class="prompter-text" id="prompterText">Naskah Anda akan tampil di sini. Mulai mengetik di panel sebelah kiri...</div>
        </div>
    </div>

    <script>
        const scriptInput = document.getElementById('script');
        const prompterText = document.getElementById('prompterText');
        const prompterContainer = document.getElementById('prompterContainer');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedInput = document.getElementById('speed');
        const speedVal = document.getElementById('speedVal');
        const fontSizeInput = document.getElementById('fontSize');
        const fontVal = document.getElementById('fontVal');
        const flipToggle = document.getElementById('flipToggle');
        const timerDisplay = document.getElementById('timer');

        let isRunning = false;
        let scrollInterval = null;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Update Teks Naskah
        scriptInput.addEventListener('input', () => {
            prompterText.textContent = scriptInput.value || 'Naskah Anda akan tampil di sini. Mulai mengetik di panel sebelah kiri...';
        });

        // Ukuran Font
        fontSizeInput.addEventListener('input', (e) => {
            prompterText.style.fontSize = `${e.target.value}px`;
            fontVal.textContent = e.target.value;
        });

        // Kecepatan
        speedInput.addEventListener('input', (e) => {
            speedVal.textContent = e.target.value;
            if (isRunning) {
                stopAutoScroll();
                startAutoScroll();
            }
        });

        // Mirror Mode
        flipToggle.addEventListener('change', (e) => {
            prompterText.classList.toggle('flipped', e.target.checked);
        });

        // Toggle Play / Pause
        startBtn.addEventListener('click', togglePlay);

        function togglePlay() {
            if (isRunning) {
                pauseAll();
            } else {
                startAll();
            }
        }

        function startAll() {
            isRunning = true;
            startBtn.textContent = 'Pause';
            startBtn.style.background = '#ff4444';
            startBtn.style.color = '#fff';
            
            startAutoScroll();
            startTimer();
        }

        function pauseAll() {
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.style.background = '#00ff88';
            startBtn.style.color = '#000';
            
            stopAutoScroll();
            stopTimer();
        }

        function startAutoScroll() {
            const speed = parseInt(speedInput.value);
            const intervalTime = 50 / speed;
            scrollInterval = setInterval(() => {
                prompterContainer.scrollTop += 1;
            }, intervalTime);
        }

        function stopAutoScroll() {
            clearInterval(scrollInterval);
        }

        // Timer Functionality
        function startTimer() {
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
                const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Reset
        resetBtn.addEventListener('click', () => {
            pauseAll();
            secondsElapsed = 0;
            timerDisplay.textContent = '00:00:00';
            prompterContainer.scrollTop = 0;
        });

        // Shortcut Keyboard (Spacebar untuk Play/Pause)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement !== scriptInput) {
                e.preventDefault();
                togglePlay();
            }
        });
    </script>
</body>
</html>
